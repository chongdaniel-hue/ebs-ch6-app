# Publishes the app to GitHub Pages on every push to main.
# Only the app files are published (index.html, app.js, styles.css, config.js
# and assets/), so the docs, tests, server and Apps Script code are never served.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Copy only the app files
        run: |
          mkdir _site
          cp index.html app.js styles.css config.js _site/
          cp -r assets _site/assets
          touch _site/.nojekyll

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload the app files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
